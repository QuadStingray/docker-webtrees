name: Check Security of latest image on Docker Hub
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  vulnerability_scanner:
    name: run vulnerability scanner
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - 'quadstingray/webtrees:latest'
          - 'quadstingray/webtrees:latest-cmm'
    steps:
      - name: Run Trivy vulnerability scanner
        # pinned to a commit (v0.36.0), never use a moving ref like @master for security tooling
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.image }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: 'trivy-results.sarif'
          category: ${{ matrix.image }}
