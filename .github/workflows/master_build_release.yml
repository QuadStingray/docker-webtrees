name: Publish Docker image

on:
  push:
    tags:
      - '*'

env:
  build_latest: auto

permissions:
  contents: read
  security-events: write

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4.3.0
        with:
          images: quadstingray/webtrees
          flavor: |
            latest=${{ env.build_latest }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push base Docker image
        uses: docker/build-push-action@v4.0.0
        with:
          context: ./webtrees
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract metadata (tags, labels) for Custom Module Manager Docker
        id: metacmm
        uses: docker/metadata-action@v4.6.0
        with:
          images: quadstingray/webtrees
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}-cmm
            type=semver,pattern={{major}}.{{minor}}-cmm
            type=semver,pattern={{major}}-cmm
            type=raw,value=latest-cmm


      - name: Build and push Custom Module Manager Docker image
        uses: docker/build-push-action@v4.0.0
        with:
          context: ./custom-module-manager
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.metacmm.outputs.tags }}
          labels: ${{ steps.metacmm.outputs.labels }}

      - name: Update readme at Dockerhub
        if: ${{ env.build_latest == 'auto' }}
        uses: meeDamian/sync-readme@v1.0.6
        with:
          user: ${{ secrets.DOCKERHUB_USER }}
          pass: ${{ secrets.DOCKERHUB_PASSWORD }}
          slug: quadstingray/webtrees
          readme: README.md
          description: true

      - name: Run Trivy vulnerability scanner
        if: ${{ env.build_latest == 'auto' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'quadstingray/webtrees:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        if: ${{ env.build_latest == 'auto' }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: 'trivy-results.sarif'
